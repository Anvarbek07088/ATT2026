services:
  - type: web
    name: att2026-platform
    runtime: node
    plan: free
    region: frankfurt
    branch: feature/central-admin-platform
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
